name: C-DAC Job Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: cdac-job-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore monitor state
        shell: bash
        run: |
          mkdir -p data

          if git ls-remote --exit-code --heads origin monitor-state > /dev/null 2>&1; then
            git fetch origin monitor-state
            git show origin/monitor-state:data/cdac_jobs.sqlite3 > data/cdac_jobs.sqlite3
            echo "Restored existing monitor state."
          else
            echo "No monitor state found."
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run C-DAC monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: src
        run: |
          python src/main.py

      - name: Save monitor state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf state-repo
          mkdir state-repo

          cd state-repo
          git init
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"

          if git ls-remote --exit-code --heads origin monitor-state > /dev/null 2>&1; then
            git fetch origin monitor-state
            git checkout -b monitor-state origin/monitor-state
          else
            git checkout --orphan monitor-state
          fi

          mkdir -p data
          cp ../data/cdac_jobs.sqlite3 data/cdac_jobs.sqlite3

          git add -f data/cdac_jobs.sqlite3

          if git diff --cached --quiet; then
            echo "Monitor state has not changed."
          else
            git commit -m "Update monitor state"
            git push origin monitor-state
          fi